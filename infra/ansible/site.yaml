---
- name: Apply common hardening to all nodes
  hosts: all
  become: yes
  roles:
    - common

- name: Install k3s server on control-plane
  hosts: control_plane
  become: yes
  roles:
    - k3s-server

- name: Install k3s agent on workers
  hosts: workers
  become: yes
  roles:
    - k3s-agent